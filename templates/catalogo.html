```html
{% extends 'plantilla.html' %}

{% block titulo %}
Catálogo
{% endblock %}

{% block cabecera %}
Catálogo de productos
{% endblock %}

{% block main %}

<div id="catalogo">

    <div>
        <form method="GET" action="{{ url_for('catalogo') }}">
            <div class="form-group">
                <input type="text"
                       class="form-control"
                       name="buscar"
                       placeholder="Buscar producto...">
            </div>

            <button type="submit" class="btn btn-primary">
                Buscar
            </button>
        </form>
    </div>

    <div class="producto">
        <h2>Título del producto</h2>

        <img src="{{ url_for('static', filename='img/producto.jpg') }}"
             alt="Imagen del producto">

        <p>$0.00</p>

        <a href="#">Ver producto</a>
    </div>

</div>

{% endblock %}
```
