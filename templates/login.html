{% extends 'plantilla.html' %}

{% block titulo %}
Iniciar sesión - Florería Tuxedo
{% endblock %}

{% block cabecera %}
Florería Tuxedo
{% endblock %}

{% block main %}

<div class="login-container">

    <div class="login-box">

        <div class="login-header">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus datos para continuar</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">

            <div class="login-field">
                <label for="lUser">Usuario o correo</label>
                <input type="text" id="lUser" name="lUser"
                       placeholder="Ingresa tu usuario" required>
            </div>

            <div class="login-field">
                <label for="lPass">Contraseña</label>
                <input type="password" id="lPass" name="lPass"
                       placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn-login">
                Iniciar sesión
            </button>

        </form>

        <div class="login-register">
            <p>¿No tienes una cuenta?</p>
            <a href="{{ url_for('registro') }}">Crear cuenta</a>
        </div>

    </div>

</div>

{% endblock %}
